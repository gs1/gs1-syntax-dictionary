---
name: GS1 Syntax Dictionary CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  #
  #  CI jobs
  #

  ci-clang:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: clang CI
        run: |

          # For llvm-symbolizer
          sudo apt-get -y --no-install-recommends install llvm

          echo '::group::Linter tests (clang+ASAN+LSAN+UBSAN)'
          make -C src -j "$(nproc)" test \
            CC=clang SANITIZE=yes SLOW_TESTS=yes
          echo '::endgroup::'

          echo '::group::Build shared lib (clang+ASAN+LSAN+UBSAN)'
          make -C src -j "$(nproc)" lib \
            CC=clang SANITIZE=yes
          echo '::endgroup::'

  ci-gcc:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: gcc CI
        run: |
          echo '::group::Linter tests (gcc+analyzer)'
          make -C src -j "$(nproc)" test \
            CC=gcc ANALYZER=yes SLOW_TESTS=yes
          echo '::endgroup::'

          echo '::group::Build shared lib (gcc+analyzer)'
          make -C src -j "$(nproc)" lib CC=gcc ANALYZER=yes
          echo '::endgroup::'

  ci-valgrind:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Valgrind memcheck CI
        run: |
          sudo apt-get update
          sudo apt-get -y --no-install-recommends install valgrind

          echo '::group::Linter tests (gcc)'
          make -C src -j "$(nproc)" test \
            CC=gcc SLOW_TESTS=yes
          echo '::endgroup::'

          echo '::group::Linter tests under valgrind'
          valgrind --tool=memcheck \
            --leak-check=full \
            --show-leak-kinds=all \
            --errors-for-leak-kinds=all \
            --error-exitcode=1 \
            --track-origins=yes \
            -s src/build-test/gs1syntaxdictionary-test
          echo '::endgroup::'

  ci-msan:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: MemorySanitizer CI
        run: |

          # For llvm-symbolizer and lld
          sudo apt-get -y --no-install-recommends install llvm lld

          make -C src -j "$(nproc)" MSAN=yes \
            SLOW_TESTS=yes test

  ci-msvc:

    runs-on: windows-latest

    steps:

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: MSVC CI
        working-directory: src
        run: |
          Write-Output '::group::MSBuild solution (Release|x86)'
          msbuild /t:Restore,Build `
            /p:Configuration=release `
            /p:Platform="x86" `
            /warnaserror gs1syntaxdictionary.sln
          Write-Output '::endgroup::'

          Write-Output '::group::Linter tests (MSVC)'
          build\test\Win32\Release\gs1syntaxdictionary-test.exe
          Write-Output '::endgroup::'

  ci-macos:

    runs-on: macos-latest

    steps:

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: clang CI
        run: |
          echo '::group::Linter tests (clang+ASAN+UBSAN)'
          make -C src -j "$(sysctl -n hw.logicalcpu)" \
            test SANITIZE=noleak SLOW_TESTS=yes
          echo '::endgroup::'

          echo '::group::Build shared lib (clang+ASAN+UBSAN)'
          make -C src -j "$(sysctl -n hw.logicalcpu)" \
            lib SANITIZE=noleak
          echo '::endgroup::'

  ci-coverage:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Coverage CI
        run: |
          sudo apt-get -y --no-install-recommends install lcov
          make -C src -j "$(nproc)" coverage

  ci-scan-build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: clang static analyser CI
        run: |
          sudo apt-get update
          sudo apt-get -y --no-install-recommends \
            install clang-tools
          echo '::group::Linter tests (clang+scan-build)'
          scan-build -o plist \
            make -C src -j "$(nproc)" test \
            CC=clang SLOW_TESTS=yes
          echo '::endgroup::'

          echo '::group::Build shared lib (clang+scan-build)'
          scan-build -o plist \
            make -C src -j "$(nproc)" lib CC=clang
          echo '::endgroup::'

          [ "$(find plist/ -name '*.html')" = '' ];

      - name: "clang static analyzer: Store assets on failure"
        uses: actions/upload-artifact@v7
        with:
          name: clang-scan.tgz
          path: plist/**/*.html
          retention-days: 30
        if: ${{ failure() }}

      - name: check includes for the linters with IWYU
        working-directory: src
        run: |
          sudo apt-get -y --no-install-recommends \
            install iwyu
          find . -name 'lint_*.c' \
            -exec bash -c \
            'iwyu -Xiwyu --error \
            -DUNIT_TESTS -DGS1_LINTER_ERR_STR_EN "$1";
            [[ $? = 0 ]] || false' _ {} \;

      - name: cppcheck
        working-directory: src
        run: |
          sudo apt-get -y --no-install-recommends \
            install cppcheck
          cppcheck --enable=all --force \
            --error-exitcode=1 \
            --check-level=exhaustive \
            --suppress='*:acutest.h' \
            -U GS1_LINTER_CUSTOM_GCP_LOOKUP \
            -U GS1_LINTER_CUSTOM_GCP_LOOKUP_H \
            -U GS1_LINTER_CUSTOM_ISO4217_LOOKUP \
            -U GS1_LINTER_CUSTOM_ISO4217_LOOKUP_H \
            -U GS1_LINTER_CUSTOM_ISO3166ALPHA2_LOOKUP \
            -U GS1_LINTER_CUSTOM_ISO3166ALPHA2_LOOKUP_H \
            -U GS1_LINTER_CUSTOM_ISO3166_LOOKUP \
            -U GS1_LINTER_CUSTOM_ISO3166_LOOKUP_H \
            -U GS1_LINTER_CUSTOM_MEDIA_TYPE_LOOKUP \
            -U GS1_LINTER_CUSTOM_MEDIA_TYPE_LOOKUP_H \
            -U GS1_LINTER_CUSTOM_PACKAGE_TYPE_LOOKUP \
            -U GS1_LINTER_CUSTOM_PACKAGE_TYPE_LOOKUP_H \
            -U CLOCK_MONOTONIC \
            -U RUNNING_ON_VALGRIND \
            -U TEST_FINI -U TEST_INIT \
            -D'DIAG_PUSH=' \
            -D'DIAG_POP=' \
            -D'DIAG_DISABLE_DEPRECATED_DECLARATIONS=' \
            --suppress=missingIncludeSystem \
            -i gs1syntaxdictionary-fuzzer-linters.c .


  ci-abi-check:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install ABI tools
        run: |
          sudo apt-get update
          sudo apt-get -y --no-install-recommends install \
            abi-compliance-checker abi-dumper

      - name: Build and dump current ABI
        run: |
          make -C src -j "$(nproc)" lib
          abi-dumper src/build/libgs1syntaxdictionary.so \
            -o current.dump \
            -lver "$(git describe --always --dirty)"

      - name: Build and dump baseline ABI from latest release
        run: |
          # Fetch release tags from canonical upstream — fork clones don't
          # mirror them by default.
          git fetch --tags https://github.com/gs1/gs1-syntax-dictionary.git
          BASELINE=$(git tag -l --sort=-refname \
                     | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | head -1)
          echo "Baseline: $BASELINE"
          git worktree add /tmp/baseline "$BASELINE"
          make -C /tmp/baseline/src -j "$(nproc)" lib
          abi-dumper /tmp/baseline/src/build/libgs1syntaxdictionary.so \
            -o baseline.dump -lver "$BASELINE"

      - name: Compare
        run: |
          abi-compliance-checker -l libgs1syntaxdictionary \
            -old baseline.dump -new current.dump

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: abi-compliance-report
          path: compat_reports/
          retention-days: 30


  #
  #  Create a release for each tagged commit
  #
  create-release:

    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    needs:
      - ci-clang
      - ci-gcc
      - ci-valgrind
      - ci-msan
      - ci-coverage
      - ci-msvc
      - ci-macos
      - ci-scan-build
      - ci-abi-check

    steps:

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --draft
